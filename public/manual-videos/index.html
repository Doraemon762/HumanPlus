le.mobile.mp4", "poster": "/media/optimized-current/life-capture-compatible.jpg", "title": "Life capture · 生活场景采集"}, {"src": "/media/optimized-current/synchronized.desktop.mp4", "mobile": "/media/optimized-current/synchronized.mobile.mp4", "poster": "/media/optimized-current/synchronized.jpg", "title": "多模态同步可视化"}, {"src": "/media/optimized-current/motion.desktop.mp4", "mobile": "/media/optimized-current/motion.mobile.mp4", "poster": "/media/optimized-current/motion.jpg", "title": "人体动作可视化"}, {"src": "/media/optimized-current/vision.desktop.mp4", "mobile": "/media/optimized-current/vision.mobile.mp4", "poster": "/media/optimized-current/vision.jpg", "title": "视觉数据可视化"}, {"src": "/media/optimized-current/hero-motion.desktop.mp4", "mobile": "/media/optimized-current/hero-motion.mobile.mp4", "poster": "/media/optimized-current/hero-motion.jpg", "title": "动作数据概览"}, {"src": "/media/optimized-current/gallery-02.desktop.mp4", "mobile": "/media/optimized-current/gallery-02.mobile.mp4", "poster": "/media/optimized-current/gallery-02.jpg", "title": "场景数据可视化 · 01"}, {"src": "/media/optimized-current/gallery-03.desktop.mp4", "mobile": "/media/optimized-current/gallery-03.mobile.mp4", "poster": "/media/optimized-current/gallery-03.jpg", "title": "场景数据可视化 · 02"}, {"src": "/media/optimized-current/gallery-04.desktop.mp4", "mobile": "/media/optimized-current/gallery-04.mobile.mp4", "poster": "/media/optimized-current/gallery-04.jpg", "title": "场景数据可视化 · 03"}, {"src": "/media/optimized-current/gallery-05.desktop.mp4", "mobile": "/media/optimized-current/gallery-05.mobile.mp4", "poster": "/media/optimized-current/gallery-05.jpg", "title": "场景数据可视化 · 04"}, {"src": "/media/optimized-current/gallery-06.desktop.mp4", "mobile": "/media/optimized-current/gallery-06.mobile.mp4", "poster": "/media/optimized-current/gallery-06.jpg", "title": "场景数据可视化 · 05"}, {"src": "/media/optimized-current/gallery-07.desktop.mp4", "mobile": "/media/optimized-current/gallery-07.mobile.mp4", "poster": "/media/optimized-current/gallery-07.jpg", "title": "场景数据可视化 · 06"}, {"src": "/media/optimized-current/gallery-08.desktop.mp4", "mobile": "/media/optimized-current/gallery-08.mobile.mp4", "poster": "/media/optimized-current/gallery-08.jpg", "title": "场景数据可视化 · 07"}, {"src": "/media/optimized-current/gallery-09.desktop.mp4", "mobile": "/media/optimized-current/gallery-09.mobile.mp4", "poster": "/media/optimized-current/gallery-09.jpg", "title": "场景数据可视化 · 08"}]}};
const $=id=>document.getElementById(id);let key,index=0;
function select(i,autoplay=false){index=i;const v=library[key].videos[i];$('player').pause();$('player').src=matchMedia('(max-width:767px)').matches&&v.mobile?v.mobile:v.src;$('player').poster=v.poster||'';$('film-title').textContent=v.title;$('description').textContent=library[key].name+' · '+library[key].kind;$('status').textContent='';document.querySelectorAll('.card').forEach((c,n)=>c.classList.toggle('active',n===i));if(autoplay){$('player').play().catch(()=>{$('status').textContent='请点击播放器中的播放按钮继续'});$('player').scrollIntoView({behavior:'smooth',block:'center'})}}
function render(){const slug=new URLSearchParams(location.search).get('product')||'weave';key=library[slug]?slug:(slug==='motion-0'?'weave':'weave');const p=library[key];document.title='产品手册视频 · '+p.name+' | HumanPlus';$('title').textContent='产品手册视频';$('subtitle').replaceChildren();const name=document.createElement('span');name.className='category-name';name.textContent=p.name;$('subtitle').append(name,document.createTextNode(p.intro));$('count').textContent=p.kind+' / '+String(p.videos.length).padStart(2,'0')+' VIDEOS';$('total').textContent=' / '+String(p.videos.length).padStart(2,'0');$('player').pause();$('player').removeAttribute('src');$('player').load();$('feature').hidden=!p.videos.length;$('empty').hidden=!!p.videos.length;$('grid').replaceChildren();p.videos.forEach((v,i)=>{let b=document.createElement('button');b.className='card';b.innerHTML='<div class="thumb"><img loading="lazy" src="'+v.poster+'" alt="'+v.title+'"><span class="circle">▶</span></div><h4>'+v.title+'</h4><p>'+p.name+' · '+String(i+1).padStart(2,'0')+'</p>';b.onclick=()=>select(i,true);$('grid').append(b)});$('links').replaceChildren();Object.entries(library).forEach(([slug,p])=>{let a=document.createElement('a');a.className='navlink'+(slug===key?' current':'');a.href='?product='+slug;if(slug===key)a.setAttribute('aria-current','page');a.innerHTML=p.name+' ↗<small>'+p.kind+' · '+(p.videos.length?p.videos.length+' 个视频':'暂无视频')+'</small>';a.onclick=e=>{e.preventDefault();history.pushState({},'',a.href);render();toggle(false);window.scrollTo({top:0,behavior:'smooth'})};$('links').append(a)});if(p.videos.length)select(0)}
function toggle(open){$('shade').classList.toggle('open',open);$('menu').setAttribute('aria-expanded',open);document.body.style.overflow=open?'hidden':'';if(open)$('close').focus();else $('menu').focus()}
$('menu').onclick=()=>toggle(true);$('close').onclick=()=>toggle(false);$('shade').onclick=e=>{if(e.target===$('shade'))toggle(false)};document.onkeydown=e=>{if(e.key==='Escape')toggle(false);if(e.key==='Tab'&&$('shade').classList.contains('open')){const nodes=[$('close'),...$('links').querySelectorAll('a')];if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0].focus()}}};$('play').onclick=()=>$('player').play().catch(()=>{$('status').textContent='视频暂时无法播放，请重试'});$('player').onerror=()=>{if($('player').getAttribute('src'))$('status').textContent='视频加载失败，请检查网络后重试'};window.onpopstate=render;render();
