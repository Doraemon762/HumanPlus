function updateScene(keepVideo=false){const videos=sceneVideos();if(!videos.length)return;const v=videos[sceneIndex],player=$('scene-player');if(!keepVideo){player.pause();setVideoSize(player,v);player.src=source(v);player.poster=v.poster;$('scene-status').textContent=''}player.setAttribute('aria-label',titleOf(v));$('prev').disabled=sceneIndex===0;$('next').disabled=sceneIndex===videos.length-1;$('dots').replaceChildren();videos.forEach((v,i)=>{const b=document.createElement('button');b.className=i===sceneIndex?'active':'';b.setAttribute('aria-label',copy[lang].scene+' '+(i+1));b.setAttribute('aria-pressed',String(i===sceneIndex));b.onclick=()=>{sceneIndex=i;updateScene()};$('dots').append(b)})}
function setVideoSize(player,v){player.width=v.width;player.height=v.height;player.parentElement.style.setProperty('--video-ratio',v.width+' / '+v.height)}
function clearVideo(player){player.pause();player.removeAttribute('src');player.load()}
function render(keepVideo=false){const slug=new URLSearchParams(location.search).get('product')||'weave';key=library[slug]?slug:'weave';const videos=mainVideos(),t=copy[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title='HumanPlus产品视频';$('title').textContent=key==='datasets'?'HumanPlus-1000':nameOf(key);$('language').dataset.lang=lang;$('language').setAttribute('aria-label',lang==='zh'?'Switch to English':'切换为中文');$('links').setAttribute('aria-label',lang==='zh'?'产品分类':'Product categories');$('home-link').textContent=t.home;$('dataset-link').textContent=t.project;$('dataset-link').hidden=key!=='datasets';$('empty-title').textContent=t.empty;$('empty-detail').textContent=t.later;$('feature').hidden=!videos.length;$('empty').hidden=!!videos.length;updateMainControls();$('links').replaceChildren();Object.keys(library).forEach(slug=>{const a=document.createElement('a');a.className='tab'+(slug===key?' current':'');a.href=route(slug);a.textContent=nameOf(slug);if(slug===key)a.setAttribute('aria-current','page');a.onclick=e=>{if(e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)return;e.preventDefault();history.pushState({},'',a.href);index=0;sceneIndex=0;render();window.scrollTo({top:0,behavior:'instant'})};$('links').append(a)});$('scenes').hidden=!sceneVideos().length;$('scene-title').textContent=t.scenes;$('prev').setAttribute('aria-label',t.prev);$('next').setAttribute('aria-label',t.next);$('dots').setAttribute('aria-label',lang==='zh'?'选择场景':'Choose a scene');if(!keepVideo){clearVideo($('player'));clearVideo($('scene-player'));$('status').textContent='';if(videos.length)select(0);if(sceneVideos().length)updateScene()}else{if(videos.length){$('player').setAttribute('aria-label',titleOf(videos[index]));$('video-caption').textContent=titleOf(videos[index])}if(sceneVideos().length)updateScene(true);if($('status').textContent)$('status').textContent=t.error;if($('scene-status').textContent)$('scene-status').textContent=t.error}}

$('main-prev').onclick=()=>{if(index>0)select(index-1)};$('main-next').onclick=()=>{if(index<mainVideos().length-1)select(index+1)};
$('language').onclick=()=>{lang=lang==='zh'?'en':'zh';try{localStorage.setItem('manual-video-language',lang)}catch{}history.replaceState({},'',route(key));render(true)};
$('prev').onclick=()=>{if(sceneIndex>0){sceneIndex--;updateScene()}};$('next').onclick=()=>{if(sceneIndex<sceneVideos().length-1){sceneIndex++;updateScene()}};
let touchStart=null;$('scene-screen').addEventListener('touchstart',e=>{touchStart=e.touches[0].clientX},{passive:true});$('scene-screen').addEventListener('touchend',e=>{if(touchStart===null)return;const delta=e.changedTouches[0].clientX-touchStart;touchStart=null;if(Math.abs(delta)>65){const next=sceneIndex+(delta<0?1:-1);if(next>=0&&next<sceneVideos().length){sceneIndex=next;updateScene()}}},{passive:true});
const players=[$('player'),$('scene-player')];players.forEach(player=>{player.onloadedmetadata=()=>{if(player.videoWidth&&player.videoHeight)player.parentElement.style.setProperty('--video-ratio',player.videoWidth+' / '+player.videoHeight)};player.onplay=()=>players.forEach(other=>{if(other!==player)other.pause()});player.onerror=()=>{if(player.getAttribute('src'))$(player===$('player')?'status':'scene-status').textContent=copy[lang].error}});window.onpopstate=()=>{lang=readLang();index=0;sceneIndex=0;render()};lang=readLang();render();
</script></body></html>
